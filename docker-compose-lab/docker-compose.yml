services:
  frontend:
    image: nginx:latest
    container_name: pathnex-frontend-compose
    ports:
    - "8082:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  backend:
    image: nginx:latest
    container_name: pathnex-backend-compose
